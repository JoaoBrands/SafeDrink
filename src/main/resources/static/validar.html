<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeDrink - Validação de Autenticidade do Selo Digital</title>
    <style>
        :root {
            --primary: #5c1d24;
            --secondary: #8c2630;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --border: #dee2e6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }

        .container { max-width: 650px; margin: 0 auto; }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; padding: 25px 20px; border-radius: 12px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        header h1 { font-size: 2rem; margin-bottom: 5px; }
        header p { font-size: 0.95rem; opacity: 0.9; }

        .search-box {
            background: var(--card-bg); padding: 20px; border-radius: 10px;
            border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px; text-align: center;
        }
        .search-box label { font-weight: bold; display: block; margin-bottom: 8px; }
        .search-input-group { display: flex; gap: 8px; justify-content: center; }
        .search-input-group input {
            padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px;
            font-size: 1rem; width: 65%;
        }
        .btn {
            padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 0.95rem; transition: background 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--secondary); }
        .btn-danger { background: var(--danger); color: white; display: inline-block; margin-top: 15px; text-decoration: none; padding: 12px 20px; }
        .btn-danger:hover { background: #bd2130; }

        .status-card {
            background: var(--card-bg); border-radius: 10px; padding: 25px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center;
            border: 2px solid transparent; display: none; margin-bottom: 20px;
        }

        .status-card.ok {
            border-color: var(--success);
            background: #f8fff9;
        }
        .status-card.danger {
            border-color: var(--danger);
            background: #fff8f8;
        }

        .status-badge {
            display: inline-block; padding: 8px 18px; border-radius: 25px;
            font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; color: white;
        }
        .badge-ok { background: var(--success); }
        .badge-danger { background: var(--danger); }

        .details-table {
            width: 100%; border-collapse: collapse; margin-top: 20px; text-align: left;
        }
        .details-table tr { border-bottom: 1px solid var(--border); }
        .details-table td { padding: 10px 8px; font-size: 0.95rem; }
        .details-table td.label { font-weight: bold; color: #555; width: 40%; }

        .navigation {
            text-align: center; margin-top: 20px;
        }
        .navigation a {
            color: var(--primary); text-decoration: none; font-weight: bold;
        }
        .navigation a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🛡️ SafeDrink</h1>
        <p>Validação Oficial de Rastreabilidade & Autenticidade</p>
    </header>

    <div class="search-box">
        <label for="inputLote">Consulte o Selo Digital da sua Bebida:</label>
        <div class="search-input-group">
            <input type="number" id="inputLote" placeholder="Digite o ID do Lote (Ex: 1 ou 2)">
            <button class="btn btn-primary" onclick="consultarManual()">Verificar</button>
        </div>
    </div>

    <!-- RESULTADO DE AUTENTICIDADE -->
    <div id="cardResultado" class="status-card">
        <div id="statusBadge" class="status-badge"></div>
        <h2 id="statusTitulo" style="margin-bottom: 10px;"></h2>
        <p id="statusMensagem" style="font-size: 0.95rem; margin-bottom: 15px; line-height: 1.4;"></p>

        <table class="details-table" id="tabelaDados">
            <tbody>
                <tr>
                    <td class="label">Número do Lote:</td>
                    <td id="detNumeroLote">-</td>
                </tr>
                <tr>
                    <td class="label">Produto / Bebida:</td>
                    <td id="detBebida">-</td>
                </tr>
                <tr>
                    <td class="label">Fabricante:</td>
                    <td id="detFabricante">-</td>
                </tr>
                <tr>
                    <td class="label">Registro MAPA:</td>
                    <td id="detRegistroMapa">-</td>
                </tr>
                <tr>
                    <td class="label">Distribuidor Oficial:</td>
                    <td id="detDistribuidor">-</td>
                </tr>
                <tr>
                    <td class="label">Data de Fabricação:</td>
                    <td id="detDataFab">-</td>
                </tr>
                <tr>
                    <td class="label">Data de Validade:</td>
                    <td id="detDataVal">-</td>
                </tr>
                <tr>
                    <td class="label">Quantidade no Lote:</td>
                    <td id="detQtd">-</td>
                </tr>
            </tbody>
        </table>

        <div id="acaoDenuncia" style="display: none;">
            <a href="denuncias.html" class="btn btn-danger">🚨 Denunciar Este Lote à Fiscalização</a>
        </div>
    </div>

    <div class="navigation">
        <a href="index.html">← Voltar para o Painel SafeDrink</a>
    </div>
</div>

<script>
    window.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const loteParam = urlParams.get("lote") || urlParams.get("id");
        if (loteParam) {
            document.getElementById("inputLote").value = loteParam;
            verificarLote(loteParam);
        }
    });

    function consultarManual() {
        const id = document.getElementById("inputLote").value.trim();
        if (!id) {
            alert("Por favor, digite o número do lote!");
            return;
        }
        verificarLote(id);
    }

    function verificarLote(id) {
        const card = document.getElementById("cardResultado");
        const badge = document.getElementById("statusBadge");
        const titulo = document.getElementById("statusTitulo");
        const mensagem = document.getElementById("statusMensagem");
        const acaoDenuncia = document.getElementById("acaoDenuncia");

        card.style.display = "block";
        badge.className = "status-badge";
        badge.textContent = "Verificando...";
        titulo.textContent = "Consultando base de dados do SafeDrink...";
        mensagem.textContent = "Aguarde enquanto os registros do fabricante e fiscalização são analisados.";
        card.className = "status-card";
        acaoDenuncia.style.display = "none";

        fetch(`/api/bebidas/lote/${id}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === "Erro" || !data.object) {
                    badge.className = "status-badge badge-danger";
                    badge.textContent = "❌ LOTE NÃO ENCONTRADO";
                    titulo.textContent = "Atenção: Registro Inexistente";
                    mensagem.textContent = "Este lote não consta na base oficial do sistema. Pode se tratar de uma bebida não registrada ou adulterada.";
                    limparDetalhes();
                    acaoDenuncia.style.display = "block";
                    return;
                }

                const lote = data.object;

                // Determina nome da bebida
                let nomeBebida = "Não especificada";
                if (lote.vinho) nomeBebida = "🍷 Vinho: " + (lote.vinho.nome || "");
                else if (lote.destilado) nomeBebida = "🥃 Destilado: " + (lote.destilado.nome || "");
                else if (lote.fermentado) nomeBebida = "🍺 Fermentado: " + (lote.fermentado.nome || "");

                // Preenchimento dos dados
                document.getElementById("detNumeroLote").textContent = lote.numeroLote || `ID ${lote.id}`;
                document.getElementById("detBebida").textContent = nomeBebida;
                document.getElementById("detFabricante").textContent = lote.fabricante ? (lote.fabricante.razaoSocial || lote.fabricante.nome) : "Desconhecido";
                document.getElementById("detRegistroMapa").textContent = lote.fabricante ? (lote.fabricante.registroMAPA || "Sem registro") : "Sem registro";
                document.getElementById("detDistribuidor").textContent = lote.distribuidor ? (lote.distribuidor.razaoSocial || lote.distribuidor.cnpj) : "Direto do Fabricante";
                document.getElementById("detDataFab").textContent = lote.dataFabricacao || "N/A";
                document.getElementById("detDataVal").textContent = lote.dataValidade || "N/A";
                document.getElementById("detQtd").textContent = lote.quantidade ? `${lote.quantidade} garrafas` : "N/A";

                // Avaliação de Autenticidade
                if (lote.suspeito === true) {
                    card.className = "status-card danger";
                    badge.className = "status-badge badge-danger";
                    badge.textContent = "🚨 ALERTA: PRODUTO SUSPEITO / RECALL";
                    titulo.textContent = "ATENÇÃO: Produto sob Intervenção Sanitária";
                    titulo.style.color = "var(--danger)";
                    mensagem.textContent = "Este lote possui histórico de adulteração ou ordem de recolhimento (recall) aberta pelos órgãos fiscalizadores. NÃO CONSUMA ESTE PRODUTO!";
                    acaoDenuncia.style.display = "block";
                } else {
                    card.className = "status-card ok";
                    badge.className = "status-badge badge-ok";
                    badge.textContent = "✅ PRODUTO AUTÊNTICO & VERIFICADO";
                    titulo.textContent = "Selo de Rastreabilidade Conforme";
                    titulo.style.color = "var(--success)";
                    mensagem.textContent = "Este lote foi devidamente registrado, atende aos requisitos oficiais do Ministério da Agricultura (MAPA) e sua procedência de distribuição é confirmada.";
                    acaoDenuncia.style.display = "none";
                }
            })
            .catch(err => {
                badge.className = "status-badge badge-danger";
                badge.textContent = "ERRO DE CONEXÃO";
                titulo.textContent = "Falha ao conectar ao servidor SafeDrink";
                mensagem.textContent = "Verifique se o backend Spring Boot está em execução: " + err;
                acaoDenuncia.style.display = "none";
            });
    }

    function limparDetalhes() {
        document.getElementById("detNumeroLote").textContent = "-";
        document.getElementById("detBebida").textContent = "-";
        document.getElementById("detFabricante").textContent = "-";
        document.getElementById("detRegistroMapa").textContent = "-";
        document.getElementById("detDistribuidor").textContent = "-";
        document.getElementById("detDataFab").textContent = "-";
        document.getElementById("detDataVal").textContent = "-";
        document.getElementById("detQtd").textContent = "-";
    }
</script>
</body>
</html>
