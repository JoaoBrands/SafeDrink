<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Fabricantes</title>
    <style>
        button {
            width: 300px;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1>SafeDrink</h1>
    <h2>CADASTRO DE FABRICANTES</h2>

    ID:
    <input type="text" id="id">
    <br><br>

    Nome:
    <input type="text" id="nome">
    <br><br>

    CPF:
    <input type="text" id="cpf">
    <br><br>

    E-mail:
    <input type="text" id="email">
    <br><br>

    Telefone:
    <input type="text" id="telefone">
    <br><br>

    Data de Cadastro:
    <input type="text" id="dataCadastro">
    <br><br>

    CNPJ:
    <input type="text" id="cnpj">
    <br><br>

    Razão Social:
    <input type="text" id="razaoSocial">
    <br><br>

    Registro MAPA:
    <input type="text" id="registroMAPA">
    <br><br>

    País de Origem:
    <input type="text" id="paisOrigem">
    <br><br>

    Regular (true/false):
    <input type="text" id="regular">
    <br><br>

    <button onclick="cadastrar()">CADASTRAR FABRICANTE</button>
    <button onclick="buscar()">BUSCAR FABRICANTE</button>

    <br><br>

    <button onclick="atualizar()">ATUALIZAR FABRICANTE</button>
    <button onclick="excluir()">EXCLUIR FABRICANTE</button>

    <br><br>

    <button onclick="listar()">LISTAR FABRICANTES</button>

    <br><br>

    <a href="index.html">
        <button>VOLTAR</button>
    </a>

    <pre id="resultado"></pre>

    <script>

    function mostrarResultado(dados) {
        if (dados.status === "Erro") {
            document.getElementById("resultado").textContent = dados.mensagemErro;
            return;
        }

        document.getElementById("resultado").textContent =
            JSON.stringify(dados.object, null, 2);
    }

    function obterFabricante(comId = false) {
        let regularVal = document.getElementById("regular").value.trim().toLowerCase();

        let fabricante = {
            nome: document.getElementById("nome").value,
            cpf: document.getElementById("cpf").value,
            email: document.getElementById("email").value,
            telefone: document.getElementById("telefone").value,
            dataCadastro: document.getElementById("dataCadastro").value,
            cnpj: document.getElementById("cnpj").value,
            razaoSocial: document.getElementById("razaoSocial").value,
            registroMAPA: document.getElementById("registroMAPA").value,
            paisOrigem: document.getElementById("paisOrigem").value,
            regular: regularVal === "" ? null : regularVal === "true"
        };

        if (comId) {
            fabricante.id = Number(document.getElementById("id").value);
        }

        return fabricante;
    }

    function cadastrar() {

        let fabricante = obterFabricante(false);

        fetch("/api/bebidas/fabricante", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(fabricante)
        })
        .then(resposta => resposta.json())
        .then(dados => mostrarResultado(dados));
    }

    function buscar() {

        let id = document.getElementById("id").value;

        fetch("/api/bebidas/fabricante/" + id)
        .then(resposta => resposta.json())
        .then(dados => {

            if (dados.status === "Erro") {
                mostrarResultado(dados);
                return;
            }

            let fabricante = dados.object;

            document.getElementById("nome").value = fabricante.nome || "";
            document.getElementById("cpf").value = fabricante.cpf || "";
            document.getElementById("email").value = fabricante.email || "";
            document.getElementById("telefone").value = fabricante.telefone || "";
            document.getElementById("dataCadastro").value = fabricante.dataCadastro || "";
            document.getElementById("cnpj").value = fabricante.cnpj || "";
            document.getElementById("razaoSocial").value = fabricante.razaoSocial || "";
            document.getElementById("registroMAPA").value = fabricante.registroMAPA || "";
            document.getElementById("paisOrigem").value = fabricante.paisOrigem || "";
            document.getElementById("regular").value = fabricante.regular !== null && fabricante.regular !== undefined ? fabricante.regular : "";

            mostrarResultado(dados);
        });
    }

    function atualizar() {

        let id = document.getElementById("id").value;
        let fabricante = obterFabricante(true);

        fetch("/api/bebidas/fabricante/" + id, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(fabricante)
        })
        .then(resposta => resposta.json())
        .then(dados => mostrarResultado(dados));
    }

    function excluir() {

        let id = document.getElementById("id").value;

        fetch("/api/bebidas/fabricante/" + id, {
            method: "DELETE"
        })
        .then(resposta => resposta.json())
        .then(dados => mostrarResultado(dados));
    }

    function listar() {

        fetch("/api/bebidas/fabricante")
        .then(resposta => resposta.json())
        .then(dados => mostrarResultado(dados));
    }

    </script>
</body>
</html>
