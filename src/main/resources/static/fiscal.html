<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Fiscais</title>
    <style>
        button {
            width: 300px;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1>SafeDrink</h1>
    <h2>CADASTRO DE FISCAIS</h2>

    ID:
    <input type="text" id="id">
    <br><br>

    Nome:
    <input type="text" id="nome">
    <br><br>

    CPF:
    <input type="text" id="cpf">
    <br><br>

    E-mail:
    <input type="text" id="email">
    <br><br>

    Telefone:
    <input type="text" id="telefone">
    <br><br>

    Data de Cadastro:
    <input type="text" id="dataCadastro">
    <br><br>

    Matrícula:
    <input type="text" id="matricula">
    <br><br>

    Órgão:
    <input type="text" id="orgao">
    <br><br>

    Região de Atuação:
    <input type="text" id="regiaoAtuacao">
    <br><br>

    <button onclick="cadastrar()">CADASTRAR FISCAL</button>
    <button onclick="buscar()">BUSCAR FISCAL</button>

    <br><br>

    <button onclick="atualizar()">ATUALIZAR FISCAL</button>
    <button onclick="excluir()">EXCLUIR FISCAL</button>

    <br><br>

    <button onclick="listar()">LISTAR FISCAIS</button>

    <br><br>

    <a href="index.html">
        <button>VOLTAR</button>
    </a>

    <pre id="resultado"></pre>

    <script>

    function mostrarResultado(dados) {
        if (dados.status === "Erro") {
            document.getElementById("resultado").textContent = dados.mensagemErro;
            return;
        }

        document.getElementById("resultado").textContent =
            JSON.stringify(dados.object, null, 2);
    }

    function obterFiscal(comId = false) {
        let fiscal = {
            nome: document.getElementById("nome").value,
            cpf: document.getElementById("cpf").value,
            email: document.getElementById("email").value,
            telefone: document.getElementById("telefone").value,
            dataCadastro: document.getElementById("dataCadastro").value,
            matricula: document.getElementById("matricula").value,
            orgao: document.getElementById("orgao").value,
            regiaoAtuacao: document.getElementById("regiaoAtuacao").value
        };

        if (comId) {
            fiscal.id = Number(document.getElementById("id").value);
        }

        return fiscal;
    }

    function cadastrar() {

        let fiscal = obterFiscal(false);

        fetch("/api/bebidas/fiscal", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(fiscal)
        })
        .then(resposta => resposta.json())
        .then(dados => mostrarResultado(dados));
    }

    function buscar() {

        let id = document.getElementById("id").value;

        fetch("/api/bebidas/fiscal/" + id)
        .then(resposta => resposta.json())
        .then(dados => {

            if (dados.status === "Erro") {
                mostrarResultado(dados);
                return;
            }

            let fiscal = dados.object;

            document.getElementById("nome").value = fiscal.nome || "";
            document.getElementById("cpf").value = fiscal.cpf || "";
            document.getElementById("email").value = fiscal.email || "";
            document.getElementById("telefone").value = fiscal.telefone || "";
            document.getElementById("dataCadastro").value = fiscal.dataCadastro || "";
            document.getElementById("matricula").value = fiscal.matricula || "";
            document.getElementById("orgao").value = fiscal.orgao || "";
            document.getElementById("regiaoAtuacao").value = fiscal.regiaoAtuacao || "";

            mostrarResultado(dados);
        });
    }

    function atualizar() {

        let id = document.getElementById("id").value;
        let fiscal = obterFiscal(true);

        fetch("/api/bebidas/fiscal/" + id, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(fiscal)
        })
        .then(resposta => resposta.json())
        .then(dados => mostrarResultado(dados));
    }

    function excluir() {

        let id = document.getElementById("id").value;

        fetch("/api/bebidas/fiscal/" + id, {
            method: "DELETE"
        })
        .then(resposta => resposta.json())
        .then(dados => mostrarResultado(dados));
    }

    function listar() {

        fetch("/api/bebidas/fiscal")
        .then(resposta => resposta.json())
        .then(dados => mostrarResultado(dados));
    }

    </script>
</body>
</html>
