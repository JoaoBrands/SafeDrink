spring.application.name=apex-bebidas
server.port=8080

# Chave exigida no cabeçalho X-Chave-Escrita para operações da fiscalização.
# Troque este valor antes de apresentar.
safedrink.chave-escrita=FISCAL-2026

spring.datasource.url=jdbc:h2:file:./RastreioBebidasDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# O schema é criado/atualizado pelo Hibernate e os dados de demonstração
# vêm do CargaDadosInicial (que só roda com o banco vazio).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
